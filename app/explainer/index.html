<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply plan explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F5F2;      /* board white */
    --panel: #FFFFFF;
    --ink: #16231F;        /* silkscreen ink */
    --muted: #5A6B65;
    --mask: #0E5E45;       /* solder-mask green: primary */
    --copper: #B8692E;     /* pegging traces */
    --late: #B07A0C;
    --short: #A8321E;
    --line: #D6DDD9;
    --r-lg: 14px; --r-sm: 6px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.5 "Archivo", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }

  header { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between;
    padding: 28px clamp(16px, 4vw, 48px) 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-weight: 800; font-stretch: 75%; font-size: clamp(28px, 4vw, 44px); line-height: 1; letter-spacing: -0.01em; }
  header p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

  .scen { display: flex; flex-wrap: wrap; gap: 6px; }
  .scen button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .scen button[aria-pressed="true"] { background: var(--mask); color: #fff; border-color: var(--mask); }

  .kpis { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 14px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--line); }
  .kpi b { font-weight: 700; font-size: 20px; margin-right: 6px; }
  .kpi span { color: var(--muted); }
  .delta.bad { color: var(--short); } .delta.good { color: var(--mask); }

  main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 24px; padding: 24px clamp(16px, 4vw, 48px) 48px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); }
  .ask button, .primary { padding: 12px 18px; border: 0; border-radius: var(--r-sm); background: var(--mask); color: #fff; font-weight: 600; cursor: pointer; }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .hints button { border: 0; background: none; color: var(--mask); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 2px 4px; }

  .answer { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 24px; }
  .answer h2 { margin: 0 0 12px; font-size: 21px; line-height: 1.3; font-weight: 700; max-width: 62ch; }
  .narr { white-space: pre-wrap; max-width: 75ch; }
  .src { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .causes { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
  .causes li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .tag { align-self: start; justify-self: start; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #E7EEEA; color: var(--mask); }
  .tag.MATERIAL { background: #F6E9DF; color: var(--copper); }
  .tag.CAPACITY, .tag.BACKLOG { background: #F5EED9; color: var(--late); }
  .tag.LEAD_TIME { background: #E8ECF3; color: #34507A; }
  .causes .obj { font-weight: 700; }
  .causes .imp { color: var(--muted); font-size: 14px; }
  .opts { margin: 16px 0 0; padding-left: 18px; }
  .opts li { margin: 6px 0; }

  aside h3, .trace h3 { margin: 0 0 10px; font-size: 16px; font-weight: 700; }
  .orders { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); max-height: 70vh; overflow: auto; }
  .orders button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; }
  .orders button:hover, .orders button[aria-current="true"] { background: #EEF3F0; }
  .orders .st { font-weight: 700; font-size: 13px; }
  .st.LATE { color: var(--late); } .st.SHORT { color: var(--short); }
  .orders small { color: var(--muted); grid-column: 1 / -1; }
  .filter { margin: 0 0 10px; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  .filter select { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); }

  /* Pegging trace: copper traces from order down to chip-level supply */
  .trace { margin-top: 22px; }
  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree ul { margin-left: 14px; padding-left: 18px; border-left: 2px solid var(--copper); }
  .tree li { position: relative; padding: 5px 0; }
  .tree ul > li::before { content: ""; position: absolute; left: -18px; top: 18px; width: 14px; border-top: 2px solid var(--copper); }
  .tree ul > li::after { content: ""; position: absolute; left: -5px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--copper); }
  .node { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); }
  .node b { font-weight: 700; }
  .node .lvl { color: var(--copper); font-weight: 700; font-size: 13px; }
  .node .el { color: var(--muted); font-size: 13px; }
  .node.changed { border-color: var(--short); box-shadow: inset 3px 0 0 var(--short); }
  .empty { color: var(--muted); padding: 16px; }
  .busy { opacity: .55; transition: opacity .2s; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Why the plan looks like this</h1>
    <p>Pick a planning run, ask about an order, component or line, and trace each confirmation down to the chip that limits it.</p>
  </div>
  <div class="scen" role="group" aria-label="Planning run" id="scen"></div>
</header>
<section class="kpis" id="kpis" aria-live="polite"></section>

<main>
  <section>
    <form class="ask" id="askForm">
      <label for="q" class="sr" hidden>Question</label>
      <input id="q" placeholder="e.g. Why is order 10000151 late? or Why is RES_CN01_SMT1 overloaded?" autocomplete="off">
      <button type="submit">Explain</button>
    </form>
    <div class="hints" id="hints"></div>
    <article class="answer" id="answer" aria-live="polite"><p class="empty">Choose a run to see why it differs from the baseline.</p></article>
    <section class="trace" id="trace" hidden>
      <h3>Pegging trace</h3>
      <ul class="tree" id="tree"></ul>
    </section>
  </section>

  <aside>
    <h3>Orders not on time</h3>
    <div class="filter"><label for="cust">Customer</label>
      <select id="cust"><option value="">All</option></select></div>
    <ul class="orders" id="orders"></ul>
  </aside>
</main>

<script>
const API = '/odata/v4/explain';
const state = { scenario: 'S1_SOC_ALLOC', baseKpi: null, order: null, changed: new Set() };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (x) => Math.round(Number(x || 0)).toLocaleString('en-US');
const money = (x) => (Math.abs(x) >= 1e6 ? `$${(x / 1e6).toFixed(1)}M` : `$${fmt(x)}`);
const q = (s) => encodeURIComponent(s);

async function get(path) {
  const r = await fetch(API + path, { headers: { Accept: 'application/json' } });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || r.statusText);
  return d;
}
async function post(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || r.statusText);
  return d;
}

async function init() {
  const [sc, base] = await Promise.all([get('/Scenarios'), get(`/ScenarioKPIs('BASE')`)]);
  state.baseKpi = base;
  $('scen').innerHTML = sc.value.map((s) =>
    `<button type="button" data-id="${esc(s.ID)}" title="${esc(s.description)}">${esc(s.name)}</button>`).join('');
  $('scen').onclick = (e) => { const b = e.target.closest('button'); if (b) selectScenario(b.dataset.id); };
  const cust = await get('/Customers?$orderby=priority');
  $('cust').innerHTML += cust.value.map((c) => `<option value="${esc(c.ID)}">${esc(c.ID)} (priority ${c.priority})</option>`).join('');
  $('cust').onchange = loadOrders;
  $('askForm').onsubmit = (e) => { e.preventDefault(); ask($('q').value); };
  selectScenario(state.scenario);
}

async function selectScenario(id) {
  state.scenario = id;
  [...$('scen').children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === id));
  const [k, ch] = await Promise.all([get(`/ScenarioKPIs('${q(id)}')`), get(`/ScenarioChanges?$filter=scenario eq '${q(id)}'&$select=object_id`)]);
  state.changed = new Set(ch.value.map((c) => c.object_id));
  const b = state.baseKpi;
  const d = (k.on_time_fill_rate_pct - b.on_time_fill_rate_pct).toFixed(1);
  $('kpis').innerHTML = `
    <div class="kpi"><b>${Number(k.on_time_fill_rate_pct).toFixed(1)}%</b><span>on-time fill rate</span>
      ${id !== 'BASE' ? ` <span class="delta ${d < 0 ? 'bad' : 'good'}">${d > 0 ? '+' : ''}${d} pts vs baseline</span>` : ''}</div>
    <div class="kpi"><b>${money(k.revenue_at_risk_usd)}</b><span>revenue late or unconfirmed</span></div>
    <div class="kpi"><b>${fmt(k.late_qty)}</b><span>units late</span></div>
    <div class="kpi"><b>${fmt(k.unconfirmed_qty)}</b><span>units unconfirmed</span></div>`;
  $('hints').innerHTML = ['Why is this run different from baseline?', 'Why is RES_MX01_FA1 overloaded?', 'Why is SOC-A78 short?']
    .map((h) => `<button type="button">${esc(h)}</button>`).join('');
  $('hints').onclick = (e) => { if (e.target.tagName === 'BUTTON') { $('q').value = e.target.textContent; ask(e.target.textContent); } };
  $('trace').hidden = true;
  loadOrders();
  explain(`/explainRun(scenario='${q(id)}',baseline='BASE',narrate=true)`);
}

async function loadOrders() {
  const c = $('cust').value;
  const f = `scenario eq '${state.scenario}' and status ne 'ON_TIME'` + (c ? ` and customer eq '${c}'` : '');
  const d = await get(`/Orders?$filter=${q(f)}&$orderby=revenue_at_risk_usd desc&$top=60`);
  $('orders').innerHTML = d.value.length ? d.value.map((o) => `
    <li><button type="button" data-id="${esc(o.order_id)}">
      <span><b>${esc(o.order_id.replace(/^0+/, ''))}</b> ${esc(o.customer)}, ${esc(o.product)}</span>
      <span class="st ${esc(o.status)}">${o.status === 'LATE' ? `+${o.max_delay_weeks} wk` : 'short'}</span>
      <small>Week ${o.req_week}, ${fmt(o.order_qty)} units, ${money(o.revenue_at_risk_usd)} at risk. Limited by ${esc(o.primary_constraint_object || 'n/a')}</small>
    </button></li>`).join('') : '<li class="empty">Every order in this run is confirmed on time.</li>';
  $('orders').onclick = (e) => { const b = e.target.closest('button'); if (b) openOrder(b.dataset.id, b); };
}

async function openOrder(id, btn) {
  [...$('orders').querySelectorAll('button')].forEach((x) => x.removeAttribute('aria-current'));
  btn?.setAttribute('aria-current', 'true');
  await explain(`/explainOrder(scenario='${q(state.scenario)}',orderId='${q(id)}',narrate=true)`);
  const t = await get(`/peggingTree(scenario='${q(state.scenario)}',orderId='${q(id)}')`);
  renderTree(JSON.parse(t.value));
}

async function ask(question) {
  if (!question.trim()) return;
  await explain(null, () => post('/ask', { scenario: state.scenario, question }));
}

async function explain(path, call) {
  const a = $('answer');
  a.classList.add('busy');
  try {
    const d = call ? await call() : await get(path);
    a.innerHTML = `
      <h2>${esc(d.headline)}</h2>
      <div class="narr">${esc(d.narrative)}</div>
      ${d.rootCauses?.length ? `<ul class="causes">${d.rootCauses.map((r) => `
        <li><span class="tag ${esc(r.type)}">${esc(r.type.replace('_', ' ').toLowerCase())}</span>
          <div><span class="obj">${esc(r.object)}</span>${r.location ? ` at ${esc(r.location)}` : ''}${r.bomLevel ? `, BOM level ${r.bomLevel}` : ''}
          ${r.impactFgQty ? `<div class="imp">${fmt(r.impactFgQty)} finished units, ${money(r.impactUsd)}</div>` : ''}</div></li>`).join('')}</ul>` : ''}
      <p class="src">Generated by ${esc(d.generatedBy)} from planning facts. Explanation ${esc(d.explanationId)}</p>`;
  } catch (e) {
    a.innerHTML = `<h2>Could not explain this</h2><p>${esc(e.message)}. Check the order number, product or resource ID and try again.</p>`;
  } finally { a.classList.remove('busy'); }
}

function renderTree(roots) {
  const node = (n) => `
    <li><span class="node ${state.changed.has(n.supply_element) ? 'changed' : ''}">
      <span class="lvl">L${n.bom_level}</span><b>${esc(n.product)}</b>@${esc(n.location)}
      <span>${fmt(n.pegged_qty)} units, week ${n.need_week}</span>
      <span class="el">${esc(n.supply_type.replace(/_/g, ' ').toLowerCase())} ${esc(n.supply_element)}</span>
    </span>${n.children?.length ? `<ul>${n.children.map(node).join('')}</ul>` : ''}</li>`;
  $('tree').innerHTML = roots.map(node).join('');
  $('trace').hidden = false;
}

init().catch((e) => { $('answer').innerHTML = `<h2>Service not reachable</h2><p>${esc(e.message)}</p>`; });
</script>
</body>
</html>
